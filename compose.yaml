services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aicard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: aicard
    ports:
      - "127.0.0.1:54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicard -d aicard"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - aicard-postgres-data:/var/lib/postgresql/data

volumes:
  aicard-postgres-data:
